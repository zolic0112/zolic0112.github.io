<!DOCTYPE html>
<!-- Shared scaffold for web-quick-builder.
     Fill every {{PLACEHOLDER}}. Delete sections the site doesn't need.
     Tokens, layout, and the signature element come from the chosen manifest —
     this scaffold only guarantees the structural and technical floor. -->
<html lang="{{LANG}}"><!-- zh-Hant | en -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION_140_160}}">
<link rel="canonical" href="{{SITE_URL}}"><!-- update after deploying -->

<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION_140_160}}">
<meta property="og:url" content="{{SITE_URL}}">
<!-- og:image 1200x630 — delete both image tags if there is no real image -->
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta name="twitter:card" content="summary_large_image">

<!-- Supply a fully URL-encoded SVG data URI; raw #, &, <, and > characters can break href parsing. -->
<link rel="icon" href="{{FAVICON_DATA_URI}}">

<!-- Delete these three lines when using system fonts only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{GOOGLE_FONTS_URL}}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{Organization|LocalBusiness|Person|Product|Event|SoftwareApplication}}",
  "name": "{{NAME}}",
  "url": "{{SITE_URL}}",
  "description": "{{DESCRIPTION_140_160}}"
}
</script>
<!-- Add a second FAQPage block if the page has an FAQ section. -->

<style>
  :root { /* tokens from the chosen manifest go here */ }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; -webkit-font-smoothing: antialiased; text-wrap: pretty; }
  img, svg, video { max-width: 100%; display: block; }
  a { color: inherit; }
  h1, h2, h3 { text-wrap: balance; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .skip { position: absolute; left: -9999px; padding: 12px 20px; z-index: 100; }
  .skip:focus { left: 12px; top: 12px; }

  .wrap { width: min(100% - clamp(32px, 8vw, 112px), var(--max, 1160px)); margin-inline: auto; }

  /* Reveal on scroll: native first, observer fallback. */
  [data-reveal] { opacity: 0; transform: translateY(14px); }
  [data-reveal].is-in { opacity: 1; transform: none;
    transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1); }

  @supports (animation-timeline: view()) {
    [data-reveal] { opacity: 1; transform: none;
      animation: reveal linear both; animation-timeline: view();
      animation-range: entry 8% cover 30%; }
    @keyframes reveal { from { opacity: 0; transform: translateY(14px); } }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
    [data-reveal] { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>

<body>
<a class="skip" href="#main">跳到主要內容</a>

<!-- Decorative signature layer (grain / wash / grid overlay) — aria-hidden -->

<header><!-- brand + nav + primary CTA --></header>

<main id="main">

  <section id="hero">
    <!-- one headline · one supporting line · one confidence cue · one primary action -->
  </section>

  <!-- Reorder and delete these examples to match sectionPolicy.orderByGoal in
       the selected manifest. Keep exactly one h1 in the hero. -->

  <section id="summary"><h2>{{重點摘要}}</h2></section>
  <section id="problem"><h2>{{解決什麼問題}}</h2></section>
  <section id="services"><h2>{{服務}}</h2></section>
  <section id="how"><h2>{{怎麼運作}}</h2></section>
  <section id="features"><h2>{{特色}}</h2></section>
  <section id="work"><h2>{{作品 / 案例 / 產品}}</h2></section>
  <section id="content"><h2>{{內容}}</h2></section>
  <section id="details"><h2>{{詳細資訊}}</h2></section>
  <section id="schedule"><h2>{{時程}}</h2></section>
  <section id="pricing"><h2>{{價格}}</h2></section>
  <section id="about"><h2>{{關於}}</h2></section>
  <section id="resources"><h2>{{延伸資源}}</h2></section>
  <section id="faq"><h2>{{常見問題}}</h2></section>
  <section id="contact"><h2>{{聯絡}}</h2></section>
  <section id="cta"><h2>{{最終行動 — 與 header CTA 同樣措辭}}</h2></section>

</main>

<footer>
  <p>© <span id="year"></span> {{NAME}}</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const nativeScroll = CSS.supports('animation-timeline: view()');

if (!reduced && !nativeScroll) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (!entry.isIntersecting) return;
      entry.target.style.transitionDelay = `${Math.min(i, 6) * 60}ms`;
      entry.target.classList.add('is-in');
      io.unobserve(entry.target);
    });
  }, { threshold: .15, rootMargin: '0px 0px -10% 0px' });
  document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));
} else {
  document.querySelectorAll('[data-reveal]').forEach(el => el.classList.add('is-in'));
}

// Add only behavior required by the selected visual system and content.
</script>
</body>
</html>
